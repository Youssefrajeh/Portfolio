<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nagham">
<title>Nagham</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--panel:#181818;--card:#1f1f1f;--hover:#2a2a2a;--text:#fff;--muted:#a7a7a7;--accent:#1ed760;--player-h:88px;--nav-h:0px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;max-width:100%;overflow-x:hidden;overscroll-behavior:none}
body{background:#000;color:var(--text);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
img{display:block}
svg{width:1em;height:1em;fill:currentColor;flex-shrink:0}
.app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:1fr var(--player-h);height:100vh;height:100dvh;gap:8px;padding:8px}
.sidebar{grid-row:1;background:var(--panel);border-radius:10px;padding:20px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;padding:0 10px 16px}
.brand img{width:34px;height:34px;border-radius:8px}
.nav-btn{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:6px;color:var(--muted);font-weight:700;font-size:16px;text-align:start;width:100%}
.nav-btn svg{font-size:22px}
.nav-btn:hover{color:#fff}
.nav-btn.active{color:#fff;background:var(--hover)}
.side-title{color:var(--muted);font-size:13px;font-weight:700;padding:16px 12px 6px}
.side-pl{padding:8px 12px;border-radius:6px;color:var(--muted);text-align:start;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-pl:hover{color:#fff;background:var(--hover)}
.main{grid-row:1;background:linear-gradient(180deg,#1f3a2b 0,var(--panel) 260px);border-radius:10px;overflow-x:hidden;overflow-y:auto;position:relative;overscroll-behavior-y:contain;touch-action:pan-y}
.main-inner{padding:24px 28px 40px;max-width:100%}
.grid>*,.hero>*{min-width:0}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;background:#2a2a2a;border-radius:500px;padding:10px 16px;border:2px solid transparent;min-width:0}
.search:focus-within{border-color:#fff}
.search input{flex:1;min-width:0;background:none;border:none;outline:none;color:#fff;font-size:16px}
.search svg{color:var(--muted);font-size:20px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.5);font-size:18px;flex-shrink:0}
.icon-btn:hover{background:rgba(0,0,0,.75)}
.pill{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:8px 14px;border-radius:500px;flex-shrink:0;white-space:nowrap}
.install-btn{background:var(--accent);color:#000}
.install-btn[hidden]{display:none}
.install-btn svg{font-size:16px}
.lang-btn{background:rgba(255,255,255,.1);color:#fff}
.lang-btn:hover{background:rgba(255,255,255,.18)}
h1{font-size:30px;font-weight:800;margin-bottom:6px}
h2{font-size:22px;font-weight:800;margin:28px 0 14px}
.sub{color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{padding:7px 14px;border-radius:500px;background:rgba(255,255,255,.08);font-size:14px;font-weight:500}
.chip:hover{background:rgba(255,255,255,.15)}
.chip.active{background:#fff;color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{background:var(--card);padding:12px;border-radius:8px;transition:background .2s;cursor:pointer;position:relative;text-align:start}
.card:hover{background:var(--hover)}
.card .cover{position:relative;margin-bottom:12px}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#333;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card.station img{object-fit:contain;background:#2a2a2a;padding:14px}
.card .play-fab{position:absolute;inset-inline-end:8px;bottom:8px;opacity:0;transform:translateY(8px);transition:.2s}
.card:hover .play-fab,.card.playing .play-fab{opacity:1;transform:none}
.card .fav{position:absolute;top:6px;inset-inline-end:6px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:18px;display:grid;place-items:center}
.card .fav.on{color:#ffd54a}
.card .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .a{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.play-fab{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;font-size:22px;box-shadow:0 8px 16px rgba(0,0,0,.4)}
.play-fab:hover{transform:scale(1.05);background:#3be477}
.tracks{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:32px 1fr 1fr 40px 56px 36px;align-items:center;gap:14px;padding:8px 12px;border-radius:6px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.08)}
.row .n{color:var(--muted);text-align:center;font-size:15px}
.row.current .n,.row.current .tt{color:var(--accent)}
.row .ti{display:flex;align-items:center;gap:12px;min-width:0}
.row img{width:42px;height:42px;border-radius:4px;object-fit:cover;background:#333;flex-shrink:0}
.row .tt{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ta,.row .al{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:var(--muted);font-size:14px;text-align:end}
.row .like,.row .more{color:var(--muted);font-size:18px;display:grid;place-items:center;opacity:0}
.row:hover .like,.row:hover .more,.row .like.on{opacity:1}
.like.on{color:var(--accent)!important}
.head-row{color:var(--muted);font-size:13px;border-bottom:1px solid #333;border-radius:0;margin-bottom:8px;cursor:default}
.head-row:hover{background:none}
.hero{display:flex;align-items:flex-end;gap:22px;margin-bottom:24px}
.hero .art{width:180px;height:180px;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.6);display:grid;place-items:center;font-size:70px;flex-shrink:0;object-fit:cover}
.hero .kind{font-size:13px;font-weight:700}
.hero h1{font-size:44px;line-height:1.1;margin:6px 0 10px;word-break:break-word}
.actions{display:flex;align-items:center;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.actions .play-fab{width:56px;height:56px;font-size:26px}
.ghost{color:var(--muted);font-size:26px}
.ghost:hover{color:#fff}
.text-btn{border:1px solid #777;padding:6px 16px;border-radius:500px;font-weight:700;font-size:14px}
.text-btn:hover{border-color:#fff}
.empty{color:var(--muted);text-align:center;padding:50px 20px;line-height:1.8}
.yt-wrap{position:relative;width:100%;max-width:760px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;margin:16px 0 10px}
.yt-wrap iframe,.yt-wrap>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-bar{display:flex;align-items:center;gap:12px;max-width:760px;margin-bottom:6px}
.yt-bar .tt{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yt-bar button{font-size:22px;color:var(--muted)}
.yt-bar button:hover{color:#fff}
.side-foot{margin-top:auto;padding:16px 12px 4px;color:var(--muted);font-size:12px;line-height:1.6}
.side-foot button{color:var(--muted);font-size:13px;font-weight:700;padding:0;text-decoration:underline}
.side-foot button:hover{color:#fff}
.about-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.about-head img{width:64px;height:64px;border-radius:14px}
.about-name{font-size:20px;font-weight:800}
.link-btn{color:var(--accent);font-weight:700;padding:0;text-decoration:underline}
.note{color:var(--muted);font-size:13px;margin-top:14px}
.spinner{width:36px;height:36px;border:3px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:50px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.player{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 12px;gap:16px}
.now{display:flex;align-items:center;gap:12px;min-width:0}
.now img{width:56px;height:56px;border-radius:4px;object-fit:cover;background:#282828;cursor:pointer}
.now .meta{min-width:0}
.now .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .a{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .like{font-size:18px;color:var(--muted)}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:6px}
.btns{display:flex;align-items:center;gap:20px;direction:ltr}
.btns button{color:var(--muted);font-size:18px;position:relative}
.btns button:hover{color:#fff}
.btns button.on{color:var(--accent)}
.btns button.on::after{content:'';position:absolute;bottom:-6px;left:50%;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.btns .pp{width:34px;height:34px;border-radius:50%;background:#fff;color:#000!important;display:grid;place-items:center;font-size:16px}
.btns .pp:hover{transform:scale(1.06)}
.bar{display:flex;align-items:center;gap:8px;width:100%;max-width:600px;direction:ltr;font-size:12px;color:var(--muted)}
.bar span{min-width:38px;text-align:center;white-space:nowrap}
.range{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:4px;border-radius:2px;background:linear-gradient(to right,#fff var(--p,0%),#4d4d4d var(--p,0%));outline:none;cursor:pointer}
.range:hover{background:linear-gradient(to right,var(--accent) var(--p,0%),#4d4d4d var(--p,0%))}
.range:disabled{cursor:default}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0}
.range:hover::-webkit-slider-thumb{opacity:1}
.range::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:none}
.extra{display:flex;align-items:center;gap:12px;direction:ltr;justify-self:end}
.extra button{color:var(--muted);font-size:18px}
.extra button:hover{color:#fff}
.extra .range{width:100px;flex:none}
.full{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#2b4a3a,#121212 70%);display:none;flex-direction:column;overflow:hidden;padding:calc(16px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.full.open{display:flex}
.full .top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.full .art{flex:1;display:grid;place-items:center;padding:24px 0;min-height:0}
.full .art img{max-width:min(100%,420px);max-height:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.full .info{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.full .info .t{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.full .info .a{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.full .like{font-size:26px;color:var(--muted)}
.full .bar{max-width:none;margin-bottom:10px}
.full .btns{justify-content:space-between;width:100%;max-width:420px;margin:0 auto}
.full .btns button{font-size:24px}
.full .btns .pp{width:64px;height:64px;font-size:28px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:#282828;border-radius:10px;padding:24px;width:100%;max-width:440px;box-shadow:0 16px 40px rgba(0,0,0,.6)}
.modal h3{font-size:22px;margin-bottom:10px}
.modal p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:14px}
.modal a{color:var(--accent)}
.modal input{width:100%;background:#3e3e3e;border:1px solid transparent;border-radius:4px;padding:12px;color:#fff;outline:none;margin-bottom:14px;font-size:16px}
.modal input:focus{border-color:#fff}
.modal .acts{display:flex;gap:10px}
.steps{color:#ddd;font-size:15px;line-height:2;margin:0 0 16px;padding-inline-start:20px}
.btn{background:#fff;color:#000;font-weight:700;padding:10px 26px;border-radius:500px}
.btn:hover{transform:scale(1.03)}
.btn.sec{background:none;color:#fff}
.menu{position:fixed;z-index:90;background:#282828;border-radius:6px;padding:4px;min-width:220px;max-width:calc(100vw - 16px);box-shadow:0 16px 24px rgba(0,0,0,.5);display:none;max-height:60vh;overflow:auto}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:start;padding:11px 12px;border-radius:3px;font-size:14px}
.menu button:hover{background:#3e3e3e}
.menu hr{border:none;border-top:1px solid #3e3e3e;margin:4px 0}
.toast{position:fixed;bottom:calc(var(--player-h) + var(--nav-h) + 24px);left:50%;transform:translateX(-50%) translateY(20px);background:#2e77d0;color:#fff;padding:10px 18px;border-radius:8px;font-weight:500;opacity:0;transition:.25s;z-index:100;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.mobile-nav{display:none}
@media (max-width:820px){
:root{--player-h:64px;--nav-h:60px}
.app{grid-template-columns:1fr;grid-template-rows:1fr;padding:0;gap:0}
.sidebar{display:none}
.main{border-radius:0;padding-bottom:calc(var(--player-h) + var(--nav-h) + 16px)}
.main-inner{padding:calc(16px + env(safe-area-inset-top)) 16px 20px}
.player{position:fixed;left:8px;right:8px;bottom:calc(var(--nav-h) + 6px + env(safe-area-inset-bottom));height:var(--player-h);background:#3a3a3a;border-radius:8px;grid-template-columns:minmax(0,1fr) auto;padding:0 8px;gap:8px;overflow:hidden;z-index:20}
.player .ctrl .bar,.player .extra{display:none}
.player .btns{gap:14px}
.player .btns .sh,.player .btns .rp,.player .btns .pv{display:none}
.player .btns .pp{background:none;color:#fff!important;font-size:24px}
.player .btns .nx{color:#fff;font-size:20px}
.now img{width:46px;height:46px}
.mini-prog{position:absolute;bottom:0;left:8px;right:8px;height:2px;background:rgba(255,255,255,.2);direction:ltr}
.mini-prog i{display:block;height:100%;background:#fff;width:0}
.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(transparent,rgba(0,0,0,.95) 30%);z-index:15}
.mobile-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px}
.mobile-nav button svg{font-size:24px}
.mobile-nav button.active{color:#fff}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row{grid-template-columns:minmax(0,1fr) 32px 32px;gap:8px;padding:6px 4px}
.row .n,.row .al,.row .d,.head-row{display:none}
.row .like,.row .more{opacity:1}
.hero{flex-direction:column;align-items:flex-start}
.hero .art{width:140px;height:140px;font-size:56px}
.hero h1{font-size:30px}
h1{font-size:24px}
.pill{padding:8px 12px}
}
@media (min-width:821px){.mini-prog{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><img src="icon.svg" alt="">Nagham</div>
<button class="nav-btn" data-view="home"><svg viewBox="0 0 24 24"><path d="M12 3 2 11h3v10h6v-6h2v6h6V11h3z"/></svg><span data-i18n="home"></span></button>
<button class="nav-btn" data-view="search"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg><span data-i18n="search"></span></button>
<button class="nav-btn" data-view="radio"><svg viewBox="0 0 24 24"><path d="M3.2 7.6 17.4 2l.7 1.9L8.9 7.5H20a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8.5c0-.4.1-.7.2-.9zM5 9.5V19h14V9.5zm4 1.5a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm6 1h2v2h-2zm0 3h2v2h-2z"/></svg><span data-i18n="radio"></span></button>
<button class="nav-btn" data-view="youtube"><svg viewBox="0 0 24 24"><path d="M21.6 7.2a2.6 2.6 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4a2.6 2.6 0 0 0-1.8 1.8C2 8.8 2 12 2 12s0 3.2.4 4.8a2.6 2.6 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.6 2.6 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8zM10 15V9l5.2 3z"/></svg><span data-i18n="youtube"></span></button>
<button class="nav-btn" data-view="library"><svg viewBox="0 0 24 24"><path d="M3 3h2v18H3zm5 0h2v18H8zm5.5 1.3 1.9-.6 5.6 16.6-1.9.7z"/></svg><span data-i18n="library"></span></button>
<div class="side-title" data-i18n="playlists"></div>
<button class="side-pl" data-view="liked">❤ <span data-i18n="liked"></span></button>
<div id="sidePls"></div>
<button class="side-pl" id="sideNewPl" data-i18n="newPlaylistPlus"></button>
<div class="side-foot"><span data-i18n="madeBy"></span> Youssef Rajeh<br><button id="sideAbout" data-i18n="about"></button></div>
</aside>
<main class="main" id="main"><div class="main-inner" id="view"></div></main>
<footer class="player" id="player">
<div class="now">
<img id="pImg" alt="" src="icon.svg">
<div class="meta"><div class="t" id="pTitle"></div><div class="a" id="pArtist"></div></div>
<button class="like" id="pLike" data-i18n-title="like"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 4.5 6.8 4.5c2 0 3.4 1.1 5.2 3 1.8-1.9 3.2-3 5.2-3 3.8 0 5.9 4 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg></button>
</div>
<div class="ctrl">
<div class="btns">
<button class="sh" id="bShuffle" data-i18n-title="shuffle"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-8 10H3v-2h2.4l8-10H17zm0 10l4 4-4 4v-3h-3.6l-2.3-2.9 1.3-1.6 1.9 2.5H17zM3 6h3.4l2.3 2.9-1.3 1.6L5.5 8H3z"/></svg></button>
<button class="pv" id="bPrev" data-i18n-title="prev"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3 7 10-7v14z"/></svg></button>
<button class="pp" id="bPlay" data-i18n-title="play"><svg viewBox="0 0 24 24" id="ppIcon"><path d="M7 4v16l13-8z"/></svg></button>
<button class="nx" id="bNext" data-i18n-title="next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l10 7-10 7z"/></svg></button>
<button class="rp" id="bRepeat" data-i18n-title="repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
</div>
<div class="bar"><span id="tCur">0:00</span><input type="range" class="range" id="seek" min="0" max="1000" value="0"><span id="tDur">0:00</span></div>
</div>
<div class="extra">

const canHls = !!document.createElement('audio').canPlayType('application/vnd.apple.mpegurl');
const toStation = s => ({id: 'r:' + s.stationuuid, uuid: s.stationuuid, name: (s.name || '').trim(),
artist: [s.country, (s.tags || '').split(',').filter(Boolean).slice(0, 2).join(', ')].filter(Boolean).join(' · '),

async function getStations(params){
const q = new URLSearchParams({hidebroken: 'true', order: 'clickcount', reverse: 'true', limit: 80, ...params});
const key = 'radio:' + q;
if(cache.has(key)) return {list: cache.get(key)};
let list, stale = false;
try{
const r = await fetch('/api/radio?' + q, {signal: AbortSignal.timeout ? AbortSignal.timeout(25000) : undefined});
if(!r.ok) throw new Error('HTTP ' + r.status);
const raw = await r.json();
const seen = new Set();
list = raw.filter(s => {
const k = (s.name || '').trim().toLowerCase();
if(!k || seen.has(k)) return false;
if(!s.tune && (!(s.url_resolved || '').startsWith('https://') || (s.hls && !canHls))) return false;
seen.add(k); return true;
}).map(toStation);
cache.set(key, list);
const saved = store.get('radioCache', {}); saved[key] = list;
const keys = Object.keys(saved); if(keys.length > 20) delete saved[keys[0]];
store.set('radioCache', saved);
}catch(e){
const saved = store.get('radioCache', {})[key];
if(!saved) throw new Error('RADIO_DOWN');
list = saved; stale = true;
}
return {list, stale};
}

}
if(!state.ytList.length){ box.innerHTML = `<div class="empty">${t('ytEmpty')}</div>`; return; }
box.innerHTML = `<div class="tracks" style="margin-top:12px">${state.ytList.map((v, i) => `<div class="row${i === state.ytIndex ? ' current' : ''}" data-y="${i}" style="grid-template-columns:minmax(0,1fr)"><div class="ti"><img loading="lazy" src="${esc(v.thumb)}" alt="" style="width:64px;height:36px"><div style="min-width:0"><div class="tt">${esc(v.title)}</div><div class="ta">${esc(v.channel)}</div></div></div></div>`).join('')}</div>`;
box.querySelectorAll('[data-y]').forEach(el => el.onclick = () => ytPlay(+el.dataset.y));
}
let ytReq = 0, ytShown = null;
async function ytSearch(){
const box = $('#ytRes'); if(!box) return;
const q = state.ytQ;
if(q && q === ytShown) return; // same search already on screen: keep the list and what's playing
const id = ++ytReq;
if(!q){ state.ytList = []; return ytShow(); }
box.innerHTML = loading();
try{
const key = 'yt:' + q.toLowerCase();
let list = cache.get(key);
if(!list){
const r = await fetch('/api/youtube?q=' + encodeURIComponent(q), {signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined});
const d = await r.json().catch(() => ({}));
if(r.status === 501) throw new Error('NO_YT_KEY');
if(!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
list = d.map(v => ({...v, title: unesc(v.title), channel: unesc(v.channel)}));
cache.set(key, list);
}
if(id !== ytReq) return;
state.ytList = list; state.ytIndex = -1; ytShown = q; ytShow();
}catch(err){
if(id !== ytReq) return;
box.innerHTML = `<div class="empty">${err.message === 'NO_YT_KEY' ? t('ytNoKey') : esc(t('ytFail') + err.message)}</div>`;
}
}

/* ---------- install ---------- */
let deferredPrompt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function canInstall(){ return !isStandalone() && (!!deferredPrompt || isIOS); }
function updInstall(){ $$('.install-btn').forEach(b => b.hidden = !canInstall()); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; updInstall(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; updInstall(); toast(t('installed')); });
async function install(){
if(deferredPrompt){ deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt = null; updInstall(); return; }
modal(`<h3>${t('installTitle')}</h3><ol class="steps"><li>${t('step1')}</li><li>${t('step2')}</li><li>${t('step3')}</li></ol><div class="acts"><button class="btn" data-close>${t('gotIt')}</button></div>`);
}
document.addEventListener('click', e => { if(e.target.closest('.install-btn')) install(); if(e.target.closest('.lang-btn')) setLang(lang === 'en' ? 'ar' : 'en'); });

/* ---------- rendering ---------- */
const V = $('#view');
const GENRES = ['popular','pop','rock','electronic','hiphop','jazz','classical','lounge','ambient','world','soundtrack','acoustic'];
const gName = g => STR[lang].genres[g];
function topbar(withSearch, q = '', withLang = false){
return `<div class="topbar">${withSearch ? `<label class="search">${ICON.search}<input id="q" placeholder="${t('searchPh')}" value="${esc(q)}" autocomplete="off"></label>` : '<div style="flex:1"></div>'}
${withLang ? `<button class="pill lang-btn" lang="${lang === 'en' ? 'ar' : 'en'}">${ICON.globe}${t('langSwitch')}</button>` : ''}
<button class="pill install-btn" ${canInstall() ? '' : 'hidden'}>${ICON.download}${t('install')}</button>
<button class="icon-btn" id="gear" title="${t('settings')}">${ICON.gear}</button></div>`;
}
function bindTop(){ const g = $('#gear'); if(g) g.onclick = () => settings(false); }
function cards(list){
return `<div class="grid">${list.map((x, i) => `<div class="card${x.live ? ' station' : ''}" data-i="${i}" data-tid="${esc(x.id)}"><div class="cover"><img loading="lazy" src="${esc(x.image)}" alt=""><button class="play-fab">${playSvg(false)}</button></div><div class="t">${esc(x.name)}</div><div class="a">${esc(x.artist)}</div></div>`).join('')}</div>`;
}
function rows(list){
if(!list.length) return `<div class="empty">${t('emptyList')}</div>`;
return `<div class="tracks"><div class="row head-row"><span class="n">#</span><span>${t('colTitle')}</span><span>${t('colAlbum')}</span><span></span><span class="d">⏱</span><span></span></div>
${list.map((x, i) => `<div class="row" data-i="${i}" data-tid="${esc(x.id)}"><span class="n">${i + 1}</span>
<div class="ti"><img loading="lazy" src="${esc(x.image)}" alt=""><div style="min-width:0"><div class="tt">${esc(x.name)}</div><div class="ta">${esc(x.artist)}</div></div></div>
<span class="al">${esc(x.live ? t('radioLabel') : x.album || '')}</span>
<button class="like ${isLiked(x.id) ? 'on' : ''}" title="${t('like')}">${ICON.heart}</button>
<span class="d">${x.live ? t('liveShort') : fmt(x.duration)}</span>
<button class="more" title="${t('more')}">${ICON.more}</button></div>`).join('')}</div>`;
}
function bind(list, ctx){
V.querySelectorAll('[data-i]').forEach(el => {
const tr = list[+el.dataset.i];
el.addEventListener('click', e => {
if(e.target.closest('.like')){ e.stopPropagation(); return toggleLike(tr); }
if(e.target.closest('.more')){ e.stopPropagation(); return trackMenu(e, tr, ctx); }
if(current()?.id === tr.id && el.classList.contains('card')) return toggle();
setQueue(list, +el.dataset.i);
});
el.addEventListener('contextmenu', e => { e.preventDefault(); trackMenu(e, tr, ctx); });
});
bindTop();
markRows();
}
function markRows(){
const id = current()?.id;
$$('.row[data-tid]').forEach(r => r.classList.toggle('current', r.dataset.tid === id));
syncPlay();
}
const loading = () => '<div class="spinner"></div>';
function errorView(err){
if(err.message === 'NO_KEY') return `<div class="empty">${t('addKeyMsg')}<br><br><button class="btn" id="addKey">${t('addKey')}</button></div>`;
return `<div class="empty">${t('loadFail')} (${esc(err.message)})<br>${t('checkNet')}<br><br><button class="btn" id="retry">${t('retry')}</button></div>`;
}
function bindError(){ const a = $('#addKey'); if(a) a.onclick = () => settings(true); const r = $('#retry'); if(r) r.onclick = render; bindTop(); }
let renderId = 0;
async function render(){
const id = ++renderId; const { view, viewArg } = state;
ytDestroy();
$$('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
$('#main').scrollTop = 0;
try{
if(view === 'home') await renderHome(id);
else if(view === 'search') await renderSearch(id, viewArg || '');
else if(view === 'library') renderLibrary();
else if(view === 'radio') await renderRadio();
else if(view === 'youtube') await renderYouTube();
else if(view === 'liked') renderList('liked', t('liked'), '❤', state.liked, 'linear-gradient(135deg,#450af5,#8e8ee5)');
else if(view === 'playlist'){
const pl = state.playlists.find(p => p.id === viewArg); if(!pl) return go('library');
renderList('playlist', pl.name, '♪', pl.tracks, 'linear-gradient(135deg,#1e3264,#509bf5)', pl);
}
else if(view === 'queue') renderList('queue', t('queue'), '≡', state.queue.slice(Math.max(0, state.index)), 'linear-gradient(135deg,#8d67ab,#e8115b)');
else if(view === 'artist') await renderArtist(id, viewArg);
else if(view === 'album') await renderAlbum(id, viewArg);
}catch(err){ if(id === renderId){ V.innerHTML = topbar(false, '', view === 'home') + errorView(err); bindError(); } }
}
function go(view, arg){ state.view = view; state.viewArg = arg ?? null; render(); }
async function renderHome(id){
const h = new Date().getHours();
const greet = t(h < 12 ? 'gMorning' : h < 18 ? 'gAfternoon' : 'gEvening');
V.innerHTML = topbar(false, '', true) + `<h1>${greet}</h1><div class="chips">${GENRES.map(k => `<button class="chip ${state.genre === k ? 'active' : ''}" data-g="${k}">${gName(k)}</button>`).join('')}</div>` +
(state.recent.length ? `<h2>${t('recent')}</h2><div id="recentBox"></div>` : '') + `<h2 id="mainTitle"></h2><div id="box">${loading()}</div>
<div class="note" style="text-align:center;margin-top:28px">${t('madeBy')} Youssef Rajeh · <button class="link-btn" id="homeAbout" style="color:var(--muted)">${t('about')}</button></div>`;
$('#homeAbout').onclick = about;
bindTop();
V.querySelectorAll('.chip').forEach(c => c.onclick = () => { state.genre = c.dataset.g; render(); });
if(state.recent.length){
const rec = state.recent.slice(0, 6);
$('#recentBox').innerHTML = cards(rec);
$('#recentBox').querySelectorAll('.card').forEach(el => el.onclick = () => {
const tr = rec[+el.dataset.i]; if(current()?.id === tr.id) return toggle(); setQueue(rec, +el.dataset.i);
});
}
const g = state.genre;
$('#mainTitle').textContent = g === 'popular' ? t('popularWeek') : t('topOf', gName(g));
const list = await getTracks(g === 'popular' ? {order: 'popularity_week'} : {fuzzytags: g, order: 'popularity_month'});
if(id !== renderId) return;
$('#box').innerHTML = cards(list);
$('#box').querySelectorAll('.card').forEach(el => {
const tr = list[+el.dataset.i];
el.onclick = () => { if(current()?.id === tr.id) return toggle(); setQueue(list, +el.dataset.i); };
el.oncontextmenu = e => { e.preventDefault(); trackMenu(e, tr); };
});
syncPlay();
}
let searchTimer;
async function renderSearch(id, q){
V.innerHTML = topbar(true, q) + `<div id="res"></div>`;
bindTop();
const inp = $('#q'); inp.focus(); inp.setSelectionRange(q.length, q.length);
inp.oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.viewArg = inp.value; doSearch(inp.value); }, 400); };
doSearch(q);
}
async function doSearch(q){
const box = $('#res'); const id = ++renderId;
if(!q.trim()){
box.innerHTML = `<h2>${t('browse')}</h2><div class="grid">${GENRES.slice(1).map((k, i) => `<button class="card" data-g="${k}" style="background:hsl(${i * 31},55%,38%);min-height:100px;font-size:20px;font-weight:800">${gName(k)}</button>`).join('')}</div>`;
box.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { state.genre = b.dataset.g; go('home'); });
return;
}
box.innerHTML = loading();
try{
const [list, artists] = await Promise.all([
getTracks({search: q, limit: 40, order: 'relevance'}),
api('artists', {namesearch: q, limit: 6}).catch(() => [])
]);
if(id !== renderId) return;
let html = '';
if(artists.length) html += `<h2>${t('artists')}</h2><div class="grid">${artists.map(a => `<div class="card art" data-a="${esc(a.id)}"><div class="cover"><img loading="lazy" src="${esc(a.image || 'icon.svg')}" alt="" style="border-radius:50%"></div><div class="t">${esc(a.name)}</div><div class="a">${t('artist')}</div></div>`).join('')}</div>`;
html += `<h2>${t('songs')}</h2>` + (list.length ? rows(list) : `<div class="empty">${esc(t('noResults', q))}</div>`);
box.innerHTML = html;
box.querySelectorAll('[data-a]').forEach(c => c.onclick = () => go('artist', c.dataset.a));
bind(list);
}catch(err){ if(id === renderId){ box.innerHTML = errorView(err); bindError(); } }
}
function renderLibrary(){
V.innerHTML = topbar(false) + `<h1>${t('library')}</h1><div class="actions" style="margin-top:14px"><button class="text-btn" id="newPl">${t('newPlaylistPlus')}</button></div>
<div class="grid">
<div class="card" data-go="liked" style="background:linear-gradient(135deg,#450af5,#8e8ee5)"><div class="t" style="font-size:22px;margin-top:40px">❤ ${t('liked')}</div><div class="a" style="color:#ddd">${t('songsCount', state.liked.length)}</div></div>
${state.playlists.map(p => `<div class="card" data-pl="${p.id}"><div class="cover"><img src="${esc(p.tracks[0]?.image || 'icon.svg')}" alt=""></div><div class="t">${esc(p.name)}</div><div class="a">${t('songsCount', p.tracks.length)}</div></div>`).join('')}
</div>`;
bindTop();
$('#newPl').onclick = () => newPlaylist();
V.querySelector('[data-go]').onclick = () => go('liked');
V.querySelectorAll('[data-pl]').forEach(c => c.onclick = () => go('playlist', c.dataset.pl));
}
function renderList(kind, title, emoji, list, bg, pl){
const total = list.reduce((s, x) => s + (x.duration || 0), 0);
V.innerHTML = topbar(false) + `<div class="hero"><div class="art" style="background:${bg}">${emoji}</div><div style="min-width:0">
<div class="kind">${kind === 'queue' ? t('upNext') : t('playlist')}</div><h1>${esc(title)}</h1><div class="sub">${t('songsCount', list.length)} · ${t('minutes', Math.round(total / 60))}</div></div></div>
<div class="actions">${list.length ? `<button class="play-fab" id="playAll">${playSvg(false)}</button><button class="ghost" id="shuf" title="${t('shufflePlay')}">🔀</button>` : ''}
${pl ? `<button class="text-btn" id="ren">${t('rename')}</button><button class="text-btn" id="del">${t('delPl')}</button>` : ''}</div>` + rows(list);
bind(list, pl ? {playlist: pl} : null);
const pa = $('#playAll'); if(pa) pa.onclick = () => { if(state.shuffle) setShuffle(false); setQueue(list, 0); };
const sh = $('#shuf'); if(sh) sh.onclick = () => { state.shuffle = true; save(); syncModes(); setQueue(list, Math.floor(Math.random() * list.length)); };
if(pl){
$('#ren').onclick = () => { modal(`<h3>${t('rename')}</h3><input id="rn" value="${esc(pl.name)}"><div class="acts"><button class="btn" id="rnOk">${t('save')}</button><button class="btn sec" data-close>${t('cancel')}</button></div>`);
$('#rnOk').onclick = () => { pl.name = $('#rn').value.trim() || pl.name; save(); closeModal(); renderSidebar(); render(); }; };
$('#del').onclick = () => { modal(`<h3>${esc(t('deleteQ', pl.name))}</h3><p>${t('cantUndo')}</p><div class="acts"><button class="btn" id="dOk">${t('del')}</button><button class="btn sec" data-close>${t('cancel')}</button></div>`);
$('#dOk').onclick = () => { state.playlists = state.playlists.filter(p => p.id !== pl.id); save(); closeModal(); renderSidebar(); go('library'); }; };
}
}
async function renderArtist(id, artistId){
V.innerHTML = topbar(false) + loading();
const [info] = await api('artists', {id: artistId});
const list = await getTracks({artist_id: artistId, order: 'popularity_total', limit: 50});
if(id !== renderId) return;
V.innerHTML = topbar(false) + `<div class="hero"><img class="art" style="border-radius:50%" src="${esc(info?.image || 'icon.svg')}" alt=""><div><div class="kind">${t('artist')}</div><h1>${esc(info?.name || '')}</h1><div class="sub">${t('songsCount', list.length)}</div></div></div>
<div class="actions"><button class="play-fab" id="playAll">${playSvg(false)}</button></div><h2>${t('popular')}</h2>` + rows(list);
bind(list); $('#playAll').onclick = () => setQueue(list, 0);
}
async function renderAlbum(id, albumId){
V.innerHTML = topbar(false) + loading();
const [al] = await api('albums', {id: albumId, imagesize: 300});
const list = await getTracks({album_id: albumId, order: 'track_position', limit: 50});
if(id !== renderId) return;
V.innerHTML = topbar(false) + `<div class="hero"><img class="art" src="${esc(al?.image || list[0]?.image || 'icon.svg')}" alt=""><div><div class="kind">${t('album')}</div><h1>${esc(al?.name || '')}</h1><div class="sub">${esc(al?.artist_name || '')} · ${esc((al?.releasedate || '').slice(0, 4))}</div></div></div>
<div class="actions"><button class="play-fab" id="playAll">${playSvg(false)}</button></div>` + rows(list);
bind(list); $('#playAll').onclick = () => setQueue(list, 0);
}
function renderSidebar(){
$('#sidePls').innerHTML = state.playlists.map(p => `<button class="side-pl" data-pl="${p.id}">${esc(p.name)}</button>`).join('');
$('#sidePls').querySelectorAll('[data-pl]').forEach(b => b.onclick = () => go('playlist', b.dataset.pl));
}
$$('[data-view]').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
$('#sideNewPl').onclick = () => newPlaylist();
$('#sideAbout').onclick = about;

/* ---------- init ---------- */
applyLang(); syncModes(); renderSidebar(); renderNow(); render();
if(!state.clientId) settings(true);
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
</html>
